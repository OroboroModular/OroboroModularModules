[package]
name = "pitch-delay"
version = "2.0.0"
edition = "2021"
description = "PitchDelay: a delay whose echoes are transposed, climbing or falling with each repeat. A compiled module for Oroboro Modular."
publish = false

[lib]
# the library the plugin loads (pitchdelay.dll, libpitchdelay.so, libpitchdelay.dylib)
name = "pitchdelay"
crate-type = ["cdylib", "rlib"]

[dependencies]
oroboro-module = { git = "https://github.com/OroboroModular/OroboroModularSDK", tag = "v0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# a project of its own, outside any workspace around it
[workspace]
