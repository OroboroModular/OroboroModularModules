[package]
name = "swarm"
version = "0.1.0"
edition = "2021"
description = "Swarm: up to seven saws spread in pitch and across the stereo field. A compiled module for Oroboro Modular."
publish = false

[lib]
# the library the plugin loads (swarm.dll, libswarm.so, libswarm.dylib)
name = "swarm"
crate-type = ["cdylib", "rlib"]

[dependencies]
oroboro-module = { git = "https://github.com/OroboroModular/OroboroModularSDK", tag = "v0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# a project of its own, outside any workspace around it
[workspace]
