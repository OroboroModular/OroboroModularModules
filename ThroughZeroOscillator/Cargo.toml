[package]
name = "through-zero"
version = "1.0.0"
edition = "2021"
description = "ThroughZero: an oscillator for through-zero FM, its frequency moved linearly and on past zero. A compiled module for Oroboro Modular."
publish = false

[lib]
# the library the plugin loads (throughzero.dll, libthroughzero.so, libthroughzero.dylib)
name = "throughzero"
crate-type = ["cdylib", "rlib"]

[dependencies]
oroboro-module = { git = "https://github.com/OroboroModular/OroboroModularSDK", tag = "v0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# a project of its own, outside any workspace around it
[workspace]
