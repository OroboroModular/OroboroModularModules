[package]
name = "spectrum"
version = "0.1.0"
edition = "2021"
description = "Spectrum: a spectrum analyser on a panel of its own, with a screen. A compiled module for Oroboro Modular."
publish = false

[lib]
# the library the plugin loads (spectrum.dll, libspectrum.so, libspectrum.dylib)
name = "spectrum"
crate-type = ["cdylib", "rlib"]

[dependencies]
oroboro-module = { git = "https://github.com/OroboroModular/OroboroModularSDK", tag = "v0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# a project of its own, outside any workspace around it
[workspace]
